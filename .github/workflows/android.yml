name: Android

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate face contracts
        run: |
          python3 scripts/check-watchface-slot-contract.py
          python3 scripts/check-watchface-layout.py
          python3 scripts/check-watchface-themes.py
      - name: Build and test
        run: |
          nix develop --no-update-lock-file --command gradle --stacktrace \
            :starintel-android:testDebugUnitTest :starintel-design:testDebugUnitTest \
            :phone-app:testDebugUnitTest :phone-app:assembleDebug \
            :quasar-app:testDebugUnitTest :quasar-app:assembleDebug \
            :collector-app:testDebugUnitTest :collector-app:assembleDebug \
            :hackmode-app:testDebugUnitTest :hackmode-app:assembleDebug \
            :operator-app:testDebugUnitTest :operator-app:assembleDebug \
            :wear-app:testDebugUnitTest :wear-app:assembleDebug \
            :watchface:assembleNeonDebug \
            :watchface:assembleCommandDebug \
            :watchface:assembleTerminalDebug
      - name: Build native journey test APKs
        run: nix develop --no-update-lock-file --command gradle :operator-app:assembleDebugAndroidTest :quasar-app:assembleDebugAndroidTest :phone-app:assembleDebugAndroidTest
      - name: Publish native journey test APKs
        uses: actions/upload-artifact@v4
        with:
          name: native-journey-tests
          path: |
            operator-app/build/outputs/apk/androidTest/debug/*.apk
            quasar-app/build/outputs/apk/androidTest/debug/*.apk
            phone-app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
      - name: Test update catalog generator
        run: python3 scripts/test-update-manifest.py
      - name: Test CI and release asset contract
        run: python3 scripts/test-release-contract.py
      - name: Test companion signer diagnostics
        run: python3 scripts/test-companion-signing.py
      - name: Verify companion signer parity
        run: bash scripts/verify-companion-signing.sh phone-app/build/outputs/apk/debug/phone-app-debug.apk wear-app/build/outputs/apk/debug/wear-app-debug.apk
      - name: Publish Android companion APK
        uses: actions/upload-artifact@v4
        with:
          name: starintel-phone-app-debug
          path: phone-app/build/outputs/apk/debug/phone-app-debug.apk
          if-no-files-found: error
      - name: Publish Star Wireless Collector APK
        uses: actions/upload-artifact@v4
        with:
          name: starintel-collector-debug
          path: collector-app/build/outputs/apk/debug/collector-app-debug.apk
          if-no-files-found: error
      - name: Publish Hackmode Android APK
        uses: actions/upload-artifact@v4
        with:
          name: starintel-hackmode-debug
          path: hackmode-app/build/outputs/apk/debug/hackmode-app-debug.apk
          if-no-files-found: error
      - name: Publish Operator Android APK
        uses: actions/upload-artifact@v4
        with:
          name: starintel-operator-debug
          path: operator-app/build/outputs/apk/debug/operator-app-debug.apk
          if-no-files-found: error
      - name: Publish Wear app APK
        uses: actions/upload-artifact@v4
        with:
          name: starintel-wear-app-debug
          path: wear-app/build/outputs/apk/debug/wear-app-debug.apk
          if-no-files-found: error
      - name: Publish native Quasar APK
        uses: actions/upload-artifact@v4
        with:
          name: quasar-android-debug
          path: quasar-app/build/outputs/apk/debug/quasar-app-debug.apk
          if-no-files-found: error
      - name: Publish Neon face APK
        uses: actions/upload-artifact@v4
        with:
          name: starintel-watchface-neon-debug
          path: watchface/build/outputs/apk/neon/debug/watchface-neon-debug.apk
          if-no-files-found: error
      - name: Publish Command face APK
        uses: actions/upload-artifact@v4
        with:
          name: starintel-watchface-command-debug
          path: watchface/build/outputs/apk/command/debug/watchface-command-debug.apk
          if-no-files-found: error
      - name: Publish Terminal face APK
        uses: actions/upload-artifact@v4
        with:
          name: starintel-watchface-terminal-debug
          path: watchface/build/outputs/apk/terminal/debug/watchface-terminal-debug.apk
          if-no-files-found: error

  nix-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Evaluate pinned Nix flake
        run: nix flake check --no-update-lock-file --show-trace
      - name: Smoke test Android device helpers
        run: |
          bash -n scripts/pair-android.sh
          bash -n scripts/pair-android-qr.sh
          bash -n scripts/test-pair-android-qr.sh
          bash -n scripts/pair-watch.sh
          bash -n scripts/install-phone.sh
          bash -n scripts/install-watch.sh
          bash -n scripts/verify-companion-signing.sh
          bash -n scripts/release.sh
          bash scripts/test-pair-android-qr.sh
          python3 scripts/test-update-manifest.py
          python3 scripts/test-release-contract.py
          nix run --no-update-lock-file .#pair-android -- --help
          nix run --no-update-lock-file .#pair-watch -- --help
          nix run --no-update-lock-file .#install-phone -- --help
          nix run --no-update-lock-file .#install-watch -- --help
          nix run --no-update-lock-file .#pair-android -- --reset-adb
          nix run --no-update-lock-file .#pair-android -- --diagnose
      - name: Build all APKs through Nix
        run: nix run --no-update-lock-file .#build-all
      - name: Verify Nix companion signer parity
        run: nix develop --no-update-lock-file --command bash scripts/verify-companion-signing.sh build/nix/phone-app-debug.apk build/nix/wear-app-debug.apk
      - name: Verify lock did not drift
        run: git diff --exit-code -- flake.lock
      - name: Verify Nix-staged APKs
        run: |
          test -s build/nix/phone-app-debug.apk
          test -s build/nix/quasar-app-debug.apk
          test -s build/nix/collector-app-debug.apk
          test -s build/nix/hackmode-app-debug.apk
          test -s build/nix/operator-app-debug.apk
          test -s build/nix/wear-app-debug.apk
          test -s build/nix/watchface-neon-debug.apk
          test -s build/nix/watchface-command-debug.apk
          test -s build/nix/watchface-terminal-debug.apk
          ls -lh build/nix/*.apk
      - name: Publish matching Nix APK bundle
        uses: actions/upload-artifact@v4
        with:
          name: starintel-nix-apks-debug
          path: build/nix/*.apk
          if-no-files-found: error

  validate-watchface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate 44 mm-class round layout contracts
        run: |
          python3 scripts/check-watchface-layout.py
          python3 scripts/check-watchface-slot-contract.py
          python3 scripts/check-watchface-themes.py
      - name: Build WFF validator
        run: |
          git clone --depth 1 https://github.com/google/watchface.git /tmp/google-watchface
          cd /tmp/google-watchface/third_party/wff
          ./gradlew :specification:validator:executable-jar
      - name: Validate all WFF v1 faces
        run: |
          set -euo pipefail
          validator=/tmp/google-watchface/third_party/wff/specification/validator/build/libs/wff-validator.jar
          for face in \
            watchface/src/neon/res/raw/watchface.xml \
            watchface/src/command/res/raw/watchface.xml \
            watchface/src/terminal/res/raw/watchface.xml; do
            echo "validating $face"
            output="$(java -jar "$validator" 1 "$face" 2>&1)"
            printf '%s\n' "$output"
            ! grep -q 'FAILED' <<<"$output"
          done

  native-journeys:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          pattern: '*debug'
          path: apks
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: native-journey-tests
          path: journey-tests
      - name: Enable emulator acceleration
        run: |
          sudo chmod 666 /dev/kvm
      - name: Run native HTTP, Keystore and UI journeys
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash scripts/test-native-journeys.sh
      - name: Preserve screenshots, view hierarchy and instrumentation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-journey-evidence
          path: build/native-journeys
          if-no-files-found: error
