name: Android

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android 16 SDK
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Validate face contracts
        run: |
          python3 scripts/check-watchface-slot-contract.py
          python3 scripts/check-watchface-layout.py
          python3 scripts/check-watchface-themes.py
      - name: Build and test
        run: |
          gradle --stacktrace \
            :phone-app:testDebugUnitTest :phone-app:assembleDebug \
            :wear-app:testDebugUnitTest :wear-app:assembleDebug \
            :watchface:assembleNeonDebug \
            :watchface:assembleCommandDebug \
            :watchface:assembleTerminalDebug
      - name: Publish Android companion APK
        uses: actions/upload-artifact@v4
        with:
          name: starintel-phone-app-debug
          path: phone-app/build/outputs/apk/debug/phone-app-debug.apk
          if-no-files-found: error
      - name: Publish Wear app APK
        uses: actions/upload-artifact@v4
        with:
          name: starintel-wear-app-debug
          path: wear-app/build/outputs/apk/debug/wear-app-debug.apk
          if-no-files-found: error
      - name: Publish Neon face APK
        uses: actions/upload-artifact@v4
        with:
          name: starintel-watchface-neon-debug
          path: watchface/build/outputs/apk/neon/debug/watchface-neon-debug.apk
          if-no-files-found: error
      - name: Publish Command face APK
        uses: actions/upload-artifact@v4
        with:
          name: starintel-watchface-command-debug
          path: watchface/build/outputs/apk/command/debug/watchface-command-debug.apk
          if-no-files-found: error
      - name: Publish Terminal face APK
        uses: actions/upload-artifact@v4
        with:
          name: starintel-watchface-terminal-debug
          path: watchface/build/outputs/apk/terminal/debug/watchface-terminal-debug.apk
          if-no-files-found: error

  nix-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Evaluate pinned Nix flake
        run: nix flake check --no-update-lock-file --show-trace
      - name: Smoke test Android device helpers
        run: |
          bash -n scripts/pair-android.sh
          bash -n scripts/pair-android-qr.sh
          bash -n scripts/test-pair-android-qr.sh
          bash -n scripts/pair-watch.sh
          bash -n scripts/install-phone.sh
          bash -n scripts/install-watch.sh
          bash scripts/test-pair-android-qr.sh
          nix run --no-update-lock-file .#pair-android -- --help
          nix run --no-update-lock-file .#pair-watch -- --help
          nix run --no-update-lock-file .#install-phone -- --help
          nix run --no-update-lock-file .#pair-android -- --reset-adb
          nix run --no-update-lock-file .#pair-android -- --diagnose
      - name: Build all APKs through Nix
        run: nix run --no-update-lock-file .#build-all
      - name: Verify lock did not drift
        run: git diff --exit-code -- flake.lock
      - name: Verify Nix-staged APKs
        run: |
          test -s build/nix/phone-app-debug.apk
          test -s build/nix/wear-app-debug.apk
          test -s build/nix/watchface-neon-debug.apk
          test -s build/nix/watchface-command-debug.apk
          test -s build/nix/watchface-terminal-debug.apk
          ls -lh build/nix/*.apk
      - name: Publish matching Nix APK bundle
        uses: actions/upload-artifact@v4
        with:
          name: starintel-nix-apks-debug
          path: build/nix/*.apk
          if-no-files-found: error

  validate-watchface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build WFF validator
        run: |
          git clone --depth 1 https://github.com/google/watchface.git /tmp/google-watchface
          cd /tmp/google-watchface/third_party/wff
          ./gradlew :specification:validator:executable-jar
      - name: Validate all WFF v1 faces
        run: |
          validator=/tmp/google-watchface/third_party/wff/specification/validator/build/libs/wff-validator.jar
          for face in \
            watchface/src/neon/res/raw/watchface.xml \
            watchface/src/command/res/raw/watchface.xml \
            watchface/src/terminal/res/raw/watchface.xml; do
            echo "validating $face"
            java -jar "$validator" 1 "$face"
          done
