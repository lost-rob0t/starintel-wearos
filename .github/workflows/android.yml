name: Android

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android 16 SDK
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build and test
        run: gradle --stacktrace :phone-app:testDebugUnitTest :phone-app:assembleDebug :wear-app:testDebugUnitTest :wear-app:assembleDebug :watchface:assembleDebug
      - name: Publish Android companion APK
        uses: actions/upload-artifact@v4
        with:
          name: starintel-phone-app-debug
          path: phone-app/build/outputs/apk/debug/phone-app-debug.apk
          if-no-files-found: error
      - name: Publish Wear app APK
        uses: actions/upload-artifact@v4
        with:
          name: starintel-wear-app-debug
          path: wear-app/build/outputs/apk/debug/wear-app-debug.apk
          if-no-files-found: error
      - name: Publish watch face APK
        uses: actions/upload-artifact@v4
        with:
          name: starintel-watchface-debug
          path: watchface/build/outputs/apk/debug/watchface-debug.apk
          if-no-files-found: error

  nix-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Evaluate pinned Nix flake
        run: nix flake check --no-update-lock-file --show-trace
      - name: Build all APKs through Nix
        run: nix run --no-update-lock-file .#build-all
      - name: Verify lock did not drift
        run: git diff --exit-code -- flake.lock
      - name: Verify Nix-staged APKs
        run: |
          test -s build/nix/phone-app-debug.apk
          test -s build/nix/wear-app-debug.apk
          test -s build/nix/watchface-debug.apk
          ls -lh build/nix/*.apk
      - name: Publish matching Nix APK bundle
        uses: actions/upload-artifact@v4
        with:
          name: starintel-nix-apks-debug
          path: build/nix/*.apk
          if-no-files-found: error

  validate-watchface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build WFF validator
        run: |
          git clone --depth 1 https://github.com/google/watchface.git /tmp/google-watchface
          cd /tmp/google-watchface/third_party/wff
          ./gradlew :specification:validator:executable-jar
      - name: Validate WFF v1
        run: |
          java -jar /tmp/google-watchface/third_party/wff/specification/validator/build/libs/wff-validator.jar \
            1 watchface/src/main/res/raw/watchface.xml
