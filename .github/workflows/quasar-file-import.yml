name: Quasar file import
on:
  pull_request:
    paths:
      - 'quasar-app/**'
      - '.github/workflows/quasar-file-import.yml'
      - 'scripts/test-file-import-journey.sh'
      - 'starintel-android/**'
jobs:
  imports:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and unit-test bounded imports
        run: nix develop --no-update-lock-file --command gradle :starintel-android:testDebugUnitTest :quasar-app:testDebugUnitTest :quasar-app:assembleDebug :quasar-app:assembleDebugAndroidTest
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Check picker, receipts, recreation and process restart
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash scripts/test-file-import-journey.sh
      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quasar-file-import-evidence
          path: |
            build/file-import
            quasar-app/build/test-results
          if-no-files-found: warn
