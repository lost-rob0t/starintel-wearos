name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Existing release tag (for example v0.1.1-alpha)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref }}
          fetch-depth: 0

      - name: Resolve release version
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          publish=true
          create_tag=false
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version='${{ inputs.version }}'
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="$GITHUB_REF_NAME"
          else
            app_version="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' phone-app/build.gradle.kts)"
            if [[ -z "$app_version" ]]; then
              echo "error: could not read phone-app versionName" >&2
              exit 1
            fi
            version="v$app_version"
            if git show-ref --verify --quiet "refs/tags/$version" || \
               git ls-remote --exit-code --tags origin "refs/tags/$version" >/dev/null 2>&1; then
              if gh release view "$version" >/dev/null 2>&1; then
                publish=false
              else
                echo "error: $version already exists without a release; rerun this workflow manually for that tag" >&2
                exit 1
              fi
            else
              create_tag=true
            fi
          fi

          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "error: invalid release tag: $version" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "create_tag=$create_tag" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ "$publish" == "false" ]]; then
            echo "$version is already published; nothing to do"
          fi

      - uses: cachix/install-nix-action@v31
        if: steps.meta.outputs.publish == 'true'
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release tag matches app versions
        if: steps.meta.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          expected="${VERSION#v}"
          codes=()
          for module in phone-app wear-app watchface; do
            file="$module/build.gradle.kts"
            actual="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' "$file")"
            code="$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\)/\1/p' "$file")"
            if [[ "$actual" != "$expected" ]]; then
              echo "error: $module versionName=$actual, tag expects $expected" >&2
              exit 1
            fi
            if [[ -z "$code" ]]; then
              echo "error: could not read $module versionCode" >&2
              exit 1
            fi
            codes+=("$code")
          done
          if [[ "${codes[0]}" != "${codes[1]}" || "${codes[0]}" != "${codes[2]}" ]]; then
            echo "error: versionCode mismatch: ${codes[*]}" >&2
            exit 1
          fi

      - name: Evaluate pinned Nix flake
        if: steps.meta.outputs.publish == 'true'
        run: nix flake check --no-update-lock-file --show-trace

      - name: Run Android unit tests
        if: steps.meta.outputs.publish == 'true'
        run: >-
          nix develop --no-update-lock-file --command
          gradle --stacktrace
          :phone-app:testDebugUnitTest
          :wear-app:testDebugUnitTest

      - name: Validate watch-face contracts
        if: steps.meta.outputs.publish == 'true'
        run: |
          python3 scripts/check-watchface-slot-contract.py
          python3 scripts/check-watchface-layout.py
          python3 scripts/check-watchface-themes.py

      - uses: actions/setup-java@v4
        if: steps.meta.outputs.publish == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - name: Build WFF validator
        if: steps.meta.outputs.publish == 'true'
        run: |
          git clone --depth 1 https://github.com/google/watchface.git /tmp/google-watchface
          cd /tmp/google-watchface/third_party/wff
          ./gradlew :specification:validator:executable-jar

      - name: Validate all WFF v1 faces
        if: steps.meta.outputs.publish == 'true'
        run: |
          validator=/tmp/google-watchface/third_party/wff/specification/validator/build/libs/wff-validator.jar
          for face in \
            watchface/src/neon/res/raw/watchface.xml \
            watchface/src/command/res/raw/watchface.xml \
            watchface/src/terminal/res/raw/watchface.xml; do
            java -jar "$validator" 1 "$face"
          done

      - name: Build all installable APKs through Nix
        if: steps.meta.outputs.publish == 'true'
        run: nix run --no-update-lock-file .#build-all

      - name: Verify companion signer parity
        if: steps.meta.outputs.publish == 'true'
        run: >-
          nix develop --no-update-lock-file --command bash
          scripts/verify-companion-signing.sh
          build/nix/phone-app-debug.apk
          build/nix/wear-app-debug.apk

      - name: Stage release assets
        if: steps.meta.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          mkdir -p dist
          cp build/nix/phone-app-debug.apk "dist/starintel-phone-${VERSION}.apk"
          cp build/nix/wear-app-debug.apk "dist/starintel-wear-${VERSION}.apk"
          cp build/nix/watchface-neon-debug.apk "dist/starintel-watchface-neon-${VERSION}.apk"
          cp build/nix/watchface-command-debug.apk "dist/starintel-watchface-command-${VERSION}.apk"
          cp build/nix/watchface-terminal-debug.apk "dist/starintel-watchface-terminal-${VERSION}.apk"
          (
            cd dist
            sha256sum ./*.apk > SHA256SUMS
            printf 'version=%s\ncommit=%s\nbuild=nix run --no-update-lock-file .#build-all\nfaces=neon,command,terminal\n' \
              "$VERSION" "$commit" > RELEASE-MANIFEST.txt
            zip -9 "starintel-wearos-${VERSION}-apks.zip" ./*.apk SHA256SUMS RELEASE-MANIFEST.txt
          )

      - name: Preserve release bundle as CI artifact
        if: steps.meta.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.meta.outputs.version }}
          path: dist/*
          if-no-files-found: error

      - name: Create release tag after all gates pass
        if: steps.meta.outputs.publish == 'true' && steps.meta.outputs.create_tag == 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$VERSION" -m "StarIntel Wear OS $VERSION" "$(git rev-parse HEAD)"
          git push origin "refs/tags/$VERSION"

      - name: Publish GitHub release
        if: steps.meta.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/* --clobber
            exit 0
          fi

          args=(
            release create "$VERSION"
            dist/*
            --verify-tag
            --generate-notes
            --title "StarIntel Wear OS $VERSION"
          )
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"
