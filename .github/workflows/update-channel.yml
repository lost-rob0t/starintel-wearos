name: Companion master channel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: companion-master-channel
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate and build current main
        run: |
          set -euo pipefail
          nix flake check --no-update-lock-file --show-trace
          python3 scripts/test-release-contract.py
          nix run --no-update-lock-file .#build-all
          nix develop --no-update-lock-file --command bash \
            scripts/verify-companion-signing.sh \
            build/nix/phone-app-debug.apk \
            build/nix/wear-app-debug.apk

      - name: Stage master channel
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          version_name="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' phone-app/build.gradle.kts)"
          version_code="$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\)/\1/p' phone-app/build.gradle.kts)"
          test -n "$version_name"
          test -n "$version_code"
          mkdir -p dist
          cp build/nix/phone-app-debug.apk dist/starintel-phone-master.apk
          cp build/nix/quasar-app-debug.apk dist/quasar-android-master.apk
          cp build/nix/collector-app-debug.apk dist/starintel-collector-master.apk
          cp build/nix/hackmode-app-debug.apk dist/starintel-hackmode-master.apk
          cp build/nix/operator-app-debug.apk dist/starintel-operator-master.apk
          cp build/nix/wear-app-debug.apk dist/starintel-wear-master.apk
          cp build/nix/watchface-neon-debug.apk dist/starintel-watchface-neon-master.apk
          cp build/nix/watchface-command-debug.apk dist/starintel-watchface-command-master.apk
          cp build/nix/watchface-terminal-debug.apk dist/starintel-watchface-terminal-master.apk
          python3 scripts/generate-update-manifest.py \
            --dist dist \
            --channel master \
            --ref main \
            --commit "$GITHUB_SHA" \
            --version-code "$version_code" \
            --version-name "$version_name" \
            --suffix master \
            --base-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/master-channel"
          (cd dist && sha256sum ./*.apk update.json > SHA256SUMS)
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"

      - name: Publish rolling master channel
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          publish_forgejo() {
            # Forgejo is the release authority: use its REST API with the
            # Actions-provided token instead of the GitHub-only gh CLI.
            api="${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}"
            auth="Authorization: token ${GH_TOKEN}"
            accept="Accept: application/json"

            release_id="$(curl -sf -H "$auth" -H "$accept" "$api/releases/tags/master-channel" | jq -r .id)" ||
            release_id="$(curl -sf -H "$auth" -H "$accept" -X POST "$api/releases" \
              -d "{\"tag_name\":\"master-channel\",\"target_commitish\":\"$GITHUB_SHA\",\"name\":\"StarIntel Companion master channel\",\"prerelease\":true,\"body\":\"Rolling artifacts from current main. Use Update Manager → MASTER.\"}" | jq -r .id)"
            test -n "$release_id" && test "$release_id" != "null"

            for f in dist/*; do
              name="$(basename "$f")"
              curl -sf -H "$auth" -X DELETE \
                "$api/releases/$release_id/assets?name=$name" >/dev/null 2>&1 || true
              curl -sf -H "$auth" -F "attachment=@$f" \
                "$api/releases/$release_id/assets?name=$name" >/dev/null
            done
          }

          publish_github() {
            if gh release view master-channel >/dev/null 2>&1; then
              gh release upload master-channel dist/* --clobber
            else
              gh release create master-channel dist/* \
                --target "$GITHUB_SHA" \
                --prerelease \
                --title "StarIntel Companion master channel" \
                --notes "Rolling artifacts from current main. Use Update Manager → MASTER."
            fi
          }

          case "${GITHUB_SERVER_URL}" in
            https://github.com|"") publish_github ;;
            *) publish_forgejo;  publish_github || true ;;
          esac

      - name: Preserve master bundle
        uses: actions/upload-artifact@v4
        with:
          name: starintel-master-channel
          path: dist/*
          if-no-files-found: error
